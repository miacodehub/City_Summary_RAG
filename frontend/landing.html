<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Polliter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="landing.css">
</head>

<body>

<div class="petals-back">
  <span class="petal p1"></span>
  <span class="petal p2"></span>
  <span class="petal p3"></span>
  <span class="petal p4"></span>
  <span class="petal p5"></span>
  <span class="petal p6"></span>
</div>

<div class="hero-card">

  <div class="logo">
      🌸
      <span>Polliter</span>
  </div>

  <h1>
      Welcome to
      <span>TravelPoll</span>
  </h1>

  <p class="subtitle">
      Travel decisions made easy.
  </p>

  <button>
      Create your first poll
      <span>→</span>
  </button>

  <div class="divider">
      <span>🌸</span>
  </div>

  <p class="footer-text">
      Plan together. Vote once. Travel smarter.
  </p>

</div>

<div class="petals-front">
  <span class="petal f1"></span>
  <span class="petal f2"></span>
  <span class="petal f3"></span>
  <span class="petal f4"></span>
  <span class="petal f5"></span>
  <span class="petal f6"></span>
  <span class="petal f7"></span>
</div>

</body>
</html>
